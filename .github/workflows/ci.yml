name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Content and i18n parity
        run: pnpm test:content

      - name: Link check
        run: pnpm test:links

      - name: Redirects and headers under wrangler pages dev
        run: pnpm test:redirects

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Interaction tests
        run: pnpm test:e2e

      - name: Accessibility (axe)
        run: pnpm test:a11y

      - name: Visual parity against the reference
        run: pnpm test:visual

      - name: Lighthouse CI
        run: pnpm lhci

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            tests/visual/__diff__/
            playwright-report/
            .lighthouseci/report/
          retention-days: 14

      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Production deploy to GitHub Pages, only after every gate above passed on main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
