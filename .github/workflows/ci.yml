name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels an older run on dev and pull requests, never on main: a production
  # deploy that has started always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  build:
    # Builds once; every other job tests the same dist/ artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore the image cache
        # Astro keeps the encoded AVIF/WebP renditions here; they only change when a photo changes.
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/images/**', 'pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  quick-gates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Content and i18n parity
        run: pnpm test:content
      - name: Link check
        run: pnpm test:links
      - name: Redirects and headers under wrangler pages dev
        run: pnpm test:redirects

  interaction-and-a11y:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Interaction tests
        run: pnpm exec playwright test --project=e2e --project=e2e-mobile
      - name: Accessibility (axe)
        run: pnpm test:a11y
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  visual-parity:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Visual parity against the reference (28 pairs)
        run: pnpm test:visual
        env:
          VISUAL_CONCURRENCY: 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/__diff__/
          retention-days: 14

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Lighthouse CI
        run: pnpm lhci
        env:
          # main measures every route; dev and pull requests measure Home and Our Work.
          LHCI_SCOPE: ${{ github.ref == 'refs/heads/main' && 'all' || 'quick' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/report/
          retention-days: 14

  deploy-cloudflare:
    # Cloudflare Pages environments, all from CI so a deploy only ever follows green gates:
    #   main          -> production (langarsewa.org)
    #   dev           -> https://dev.langarsewa.pages.dev (the shared test site)
    #   pull requests -> a preview URL per branch, posted on the PR
    # Skips cleanly until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [quick-gates, interaction-and-a11y, visual-parity, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/dev' && 'dev' || 'preview') }}
      url: ${{ steps.cf.outputs.deployment-url }}
    steps:
      - id: secrets
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present == 'true'
        # Only the smoke script: a full checkout brings pnpm-lock.yaml, which makes wrangler-action
        # try to use pnpm on a runner that has none.
        uses: actions/checkout@v4
        with:
          sparse-checkout: tests/smoke.mjs
          sparse-checkout-cone-mode: false
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - if: steps.secrets.outputs.present == 'true'
        id: cf
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.151.1'
          command: pages deploy dist --project-name=langarsewa --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }}
      - if: steps.secrets.outputs.present == 'true'
        run: echo "Deployed to ${{ steps.cf.outputs.deployment-url }}"
      - name: Smoke test the deployment
        if: steps.secrets.outputs.present == 'true'
        run: node tests/smoke.mjs "${{ steps.cf.outputs.deployment-url }}"
      - name: Post the preview link on the pull request
        if: steps.secrets.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.cf.outputs.deployment-url }}';
            const marker = '<!-- cloudflare-preview -->';
            const body = `${marker}\nPreview for this pull request: ${url}\n\nEvery gate passed before this deploy. Production is unchanged until the merge to \`main\`.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - if: steps.secrets.outputs.present != 'true'
        run: echo "Cloudflare secrets not configured; skipping."
